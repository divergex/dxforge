<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dockerfile Editor - {{ project_name }}</title>
<style>
  body { font-family: sans-serif; margin: 2rem; }
  label { display: block; margin-top: 1rem; }
  textarea { width: 100%; height: 200px; margin-top: 1rem; font-family: monospace; }
  select, input { margin-top: 0.5rem; }
</style>
</head>
<body>

<h1>Dockerfile Editor for project: {{ project_name }}</h1>

<label>
  Base Image:
  <select id="baseImage">
    <option value="">-- None --</option>
    <option value="python:3.12-slim">python:3.12-slim</option>
    <option value="python:3.12-alpine">python:3.12-alpine</option>
    <option value="ubuntu:22.04">ubuntu:22.04</option>
    <option value="debian:12-slim">debian:12-slim</option>
  </select>
</label>

<label>
  Entry Point Python File:
  <input type="text" id="entryPoint" placeholder="e.g. main.py">
</label>

<button onclick="generateDockerfile()">Create Dockerfile</button>

<script>
function generateDockerfile() {
    const baseImage = document.getElementById('baseImage').value;
    const entryPoint = document.getElementById('entryPoint').value.trim();
    let dockerfile = '';

    if (baseImage) {
        dockerfile += `FROM ${baseImage}\\n`;
        dockerfile += `WORKDIR /app\\n`;
        dockerfile += `COPY . /app\\n`;
        if (entryPoint) {
            dockerfile += `CMD ["python", "${entryPoint}"]\\n`;
        }
    } else {
        dockerfile = '# No base image selected.\\n';
    }

    const projectName = "{{ project_name }}";

    fetch(`/project/${projectName}/configure`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ content: dockerfile })
    })
    .then(response => response.json())
    .then(data => {
        if (data.message) {
            alert(data.message);
        } else if (data.detail) {
            alert(data.detail);
        }
    })
    .catch(err => {
        console.error(err);
        alert("Failed to send Dockerfile.");
    });
}
</script>

</body>
</html>
