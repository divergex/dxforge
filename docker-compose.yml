networks:
  default:
    name: divergex


services:
  mongo:
    image: mongo:7.0
    container_name: dxforge-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  mongo-data:

  minio-data:
