[alembic]
script_location = src/dxforge/db/migrations
prepend_sys_path = src
# database URL is resolved at runtime by env.py:
#   export FORGE_MIGRATE_URL="postgresql+psycopg://forge:$(cat secrets/postgres_password.txt)@127.0.0.1:5432/forge"

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
